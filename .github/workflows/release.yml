name: Release

# Entry point of a release. It only resolves the tag and starts the two
# independent pipelines, in parallel:
#
#   release-cli.yml  frontend + CLI binaries, harness gate, GitHub release,
#                    CLI npm publish, verify-release-cli.yml
#   release-gui.yml  desktop packages, attach to the release, GUI npm publish,
#                    verify-release-gui.yml
#
# A tag push (v*) runs the CLI only: GUI builds are slow, unsigned and rarer, so
# they are opt-in. Start one by dispatching this workflow with build_gui, or
# dispatch release-gui.yml directly (any time, before or after the CLI release).
# Either pipeline can also be dispatched alone. Whichever finishes first creates
# the GitHub release (.github/actions/ensure-release); the other attaches to it.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v0.20250101.0)'
        required: true
        type: string
        default: ''
      build_cli:
        description: 'Release the CLI (release-cli.yml)'
        required: false
        type: boolean
        default: true
      build_gui:
        description: 'Release the desktop GUI (release-gui.yml); off by default'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.set_vars.outputs.release_tag }}
      build_cli: ${{ steps.set_vars.outputs.build_cli }}
      build_gui: ${{ steps.set_vars.outputs.build_gui }}
    steps:
      - name: Set variables
        id: set_vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "release_tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
            echo "build_cli=${{ github.event.inputs.build_cli }}" >> $GITHUB_OUTPUT
            echo "build_gui=${{ github.event.inputs.build_gui }}" >> $GITHUB_OUTPUT
          else
            echo "release_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "build_cli=true" >> $GITHUB_OUTPUT
            echo "build_gui=false" >> $GITHUB_OUTPUT
          fi

  # A called workflow's job permissions can only narrow its caller's, so the
  # write scopes the pipelines need (release assets, npm dispatch) are granted here.
  cli:
    name: Release CLI
    needs: setup
    if: needs.setup.outputs.build_cli == 'true'
    uses: ./.github/workflows/release-cli.yml
    permissions:
      contents: write
      actions: write
    with:
      release_tag: ${{ needs.setup.outputs.release_tag }}

  gui:
    name: Release GUI
    needs: setup
    if: needs.setup.outputs.build_gui == 'true'
    uses: ./.github/workflows/release-gui.yml
    permissions:
      contents: write
      actions: write
    with:
      release_tag: ${{ needs.setup.outputs.release_tag }}
