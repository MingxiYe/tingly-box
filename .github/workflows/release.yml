name: Release

# Entry point of a release. It only resolves the tag and starts the two
# independent pipelines, in parallel:
#
#   release-cli.yml  frontend + CLI binaries, harness gate, GitHub release,
#                    CLI npm publish, verify-release-cli.yml
#   release-gui.yml  desktop packages, attach to the release, GUI npm publish,
#                    verify-release-gui.yml
#
# A tag push (v*) runs the CLI only: GUI builds are slow, unsigned and rarer, so
# they are opt-in. Start one by dispatching this workflow with build_gui, or
# dispatch release-gui.yml directly (any time, before or after the CLI release).
# Either pipeline can also be dispatched alone; whichever finishes first creates
# the GitHub release (ensure-release) and the other attaches to it.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v0.20250101.0)'
        required: true
        type: string
        default: ''
      build_gui:
        description: 'Release the desktop GUI (release-gui.yml); off by default'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # A called workflow's job permissions can only narrow its caller's, so the
  # write scopes the pipelines need (release assets, npm dispatch) are granted here.
  # A tag push has no inputs: the tag is the ref name, and only the CLI runs.
  cli:
    name: Release CLI
    uses: ./.github/workflows/release-cli.yml
    permissions:
      contents: write
      actions: write
    with:
      release_tag: ${{ inputs.release_tag || github.ref_name }}

  gui:
    name: Release GUI
    if: inputs.build_gui
    uses: ./.github/workflows/release-gui.yml
    permissions:
      contents: write
      actions: write
    with:
      release_tag: ${{ inputs.release_tag }}
