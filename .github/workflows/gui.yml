name: GUI Build

# Unsigned Wails3 desktop GUI packages, one per platform the release and the
# tingly-box-gui npm package distribute:
#
#   tingly-box-gui-macos-arm64.zip    TinglyBox.app (Apple Silicon)
#   tingly-box-gui-macos-amd64.zip    TinglyBox.app (Intel, cross-built)
#   tingly-box-gui-windows-amd64.zip  tingly-box.exe
#
# The macOS names are a contract: build/npx/tingly-box-gui/bin.js downloads
# exactly `tingly-box-gui-macos-<arch>.zip` from the release tag. macOS apps
# are ad-hoc signed only (no Developer ID, no notarization) — fine through npm,
# which never sets the quarantine flag; a browser download needs one
# "Open Anyway" (see the release notes).
#
# Called by release.yml (workflow_call); dispatch it by hand for a test build.

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Version baked into the binaries'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version label (e.g. v1.6.2). Empty = dev-<sha>.'
        required: false
        type: string
        default: ''

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '24'
  # Keep in lockstep with gui/wails3/go.mod and Taskfile.wails.yml's wails:check.
  WAILS_VERSION: v3.0.0-beta.26

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, platform: macos, arch: arm64 }
          # Cross-built on the Apple Silicon runner: cgo passes -arch x86_64.
          - { os: macos-latest, platform: macos, arch: amd64 }
          - { os: windows-latest, platform: windows, arch: amd64 }
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          VERSION="${{ inputs.release_tag }}"
          [ -n "$VERSION" ] || VERSION="dev-${GITHUB_SHA:0:7}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "* \`${{ matrix.platform }}-${{ matrix.arch }}\`: version \`${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-gui-${{ matrix.arch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-gui-${{ matrix.arch }}-
            ${{ runner.os }}-go-

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            frontend/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install go-task and wails3
        shell: bash
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Install frontend dependencies
        shell: bash
        working-directory: ./frontend
        run: |
          corepack enable
          pnpm approve-builds --all
          pnpm install --frozen-lockfile

      - name: Run codegen
        run: task codegen

      - name: Package (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          task darwin:package ARCH=${{ matrix.arch }} VERSION="${{ steps.ver.outputs.version }}"
          codesign --verify --deep --strict --verbose=2 bin/TinglyBox.app
          # The cross-built amd64 bundle must really be x86_64 — a wrong-arch
          # app would only fail on an Intel user's machine.
          EXPECT=$([ "${{ matrix.arch }}" = amd64 ] && echo x86_64 || echo arm64)
          file bin/TinglyBox.app/Contents/MacOS/tingly-box | tee /dev/stderr | grep -q "Mach-O 64-bit executable ${EXPECT}"
          mkdir -p dist
          # --norsrc --noextattr: without them ditto stores extended attributes
          # as "._*" entries, which unzip and the npm shim's unzipper write
          # into the bundle as files and so break its signature.
          ditto -c -k --norsrc --noextattr --keepParent bin/TinglyBox.app "dist/tingly-box-gui-macos-${{ matrix.arch }}.zip"
          ls -la dist/

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          task windows:build PRODUCTION=true ARCH=${{ matrix.arch }} VERSION="${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path bin/tingly-box.exe -DestinationPath dist/tingly-box-gui-windows-${{ matrix.arch }}.zip
          Get-ChildItem dist

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*.zip
          retention-days: 7
