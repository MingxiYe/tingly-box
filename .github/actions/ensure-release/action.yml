name: Ensure GitHub release
description: >-
  Create the release for a tag if it does not exist yet (with generated notes).
  release-cli.yml and release-gui.yml run in parallel and either may finish first,
  so both call this and then only upload assets and edit their own notes section.
inputs:
  tag:
    description: Release tag
    required: true
runs:
  using: composite
  steps:
    - name: Create the release if missing
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
      run: |
        # If the other pipeline wins the creation race, the release exists anyway.
        gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes \
          || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
