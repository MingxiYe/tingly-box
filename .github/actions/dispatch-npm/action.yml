name: Dispatch npm publish
description: >-
  Start npm.yml for a release tag (it then waits at the `production` approval;
  nothing is published by this). npm.yml is dispatched explicitly because releases
  made with GITHUB_TOKEN do not fire its `release: published` trigger. Needs
  `actions: write`.
inputs:
  tag:
    description: Release tag
    required: true
  publish_cli:
    description: Publish the tingly-box CLI packages
    required: true
  publish_gui:
    description: Publish the tingly-box-gui packages
    required: true
  build_docker:
    description: Build the npm Docker image
    required: true
runs:
  using: composite
  steps:
    - name: Dispatch npm.yml
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
        PUBLISH_CLI: ${{ inputs.publish_cli }}
        PUBLISH_GUI: ${{ inputs.publish_gui }}
        BUILD_DOCKER: ${{ inputs.build_docker }}
      run: |
        # Same inference npm.yml applies on a release event: stable -> latest,
        # pre-release (v1.2.3-rc1) -> rc.
        if [[ "${TAG#v}" == *-* ]]; then NPM_TAG=rc; else NPM_TAG=latest; fi

        gh workflow run npm.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" \
          -f tag="$TAG" -f npm_tag="$NPM_TAG" \
          -f publish_cli="$PUBLISH_CLI" -f publish_gui="$PUBLISH_GUI" -f build_docker="$BUILD_DOCKER"

        # Best effort: link the dispatched run so approvers can find it from here.
        RUN_URL=""
        for _ in 1 2 3 4 5 6; do
          sleep 5
          RUN_URL="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow npm.yml \
            --event workflow_dispatch --branch "$TAG" --limit 1 \
            --json url -q '.[0].url' 2>/dev/null || true)"
          [ -n "$RUN_URL" ] && break
        done

        {
          echo "## 📦 NPX publish dispatched"
          echo ""
          echo "| Item | Value |"
          echo "| --- | --- |"
          echo "| Release | \`$TAG\` |"
          echo "| npm dist-tag | \`$NPM_TAG\` |"
          echo "| Publish | cli=$PUBLISH_CLI, gui=$PUBLISH_GUI, docker=$BUILD_DOCKER |"
          if [ -n "$RUN_URL" ]; then
            echo "| Run | $RUN_URL |"
          else
            echo "| Run | see the [NPX Package Publish workflow](https://github.com/$GITHUB_REPOSITORY/actions/workflows/npm.yml) |"
          fi
          echo ""
          echo "The run waits for approval of the \`production\` environment before publishing."
        } >> "$GITHUB_STEP_SUMMARY"
